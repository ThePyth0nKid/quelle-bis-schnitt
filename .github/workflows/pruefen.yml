# SPDX-License-Identifier: MIT
# Prüft jeden Push und jeden Pull Request: Leck-Schutz, Lizenzangaben, Plugin-Manifeste, Python-Werkzeuge.
# Actions sind auf Commit-SHAs festgenagelt (Tag im Kommentar); Werkzeuge mit fester Version.
name: pruefen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leck-schutz:
    name: Geheimnisse, Sperrliste, Lizenzangaben
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks über die ganze Historie
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

      # Die private Sperrliste kommt nur bei Push und manuellem Lauf im Original-Repo aus einem Actions-Secret.
      # Pull Requests (auch aus Branches des Original-Repos) bekommen es nie: Der PR-Stand könnte das Prüfskript
      # verändern und das Secret ausgeben. Sie prüfen nur die öffentlichen Regeln; die volle Prüfung folgt beim Push.
      - name: Sperrliste über die ganze Historie
        env:
          OSS_SCRUB_SPERRLISTE_INHALT: ${{ github.event_name != 'pull_request' && secrets.OSS_SCRUB_SPERRLISTE_INHALT || '' }}
          IST_ORIGINAL: ${{ github.repository == 'ThePyth0nKid/quelle-bis-schnitt' && github.event_name != 'pull_request' }}
        run: |
          if [ -n "$OSS_SCRUB_SPERRLISTE_INHALT" ]; then
            python3 werkzeuge/scrub/pruefen.py --historie --privat-pflicht
          elif [ "$IST_ORIGINAL" = "true" ]; then
            echo "::error::Secret OSS_SCRUB_SPERRLISTE_INHALT fehlt im Original-Repo."
            exit 1
          else
            echo "::notice::Ohne private Sperrliste (Pull Request oder Fork): nur öffentliche Regeln."
            python3 werkzeuge/scrub/pruefen.py --historie --nur-oeffentlich
          fi

      - name: REUSE (Lizenzangaben je Datei)
        run: pipx run --spec "reuse[charset-normalizer]==6.2.0" reuse lint

  plugins:
    name: Marktplatz und Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Claude Code (nur für plugin validate, ohne Anmeldung)
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: claude plugin validate --strict
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do
            claude plugin validate --strict "$p"
          done
      - name: Querprüfung Marktplatz, Frontmatter, .mcp.json
        run: python3 werkzeuge/marktplatz/pruefen.py

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      # Tests, die ffmpeg brauchen, werden ohne ffmpeg übersprungen; unter Linux läuft es mit.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Umgebung
        run: |
          uv venv --python 3.12
          uv pip install pytest ruff requests
          if [ -d plugins/studio/werkzeuge ]; then uv pip install -e "plugins/studio/werkzeuge[test]"; fi
      - name: ruff
        run: uv run --no-sync ruff check .
      - name: pytest
        run: uv run --no-sync pytest
